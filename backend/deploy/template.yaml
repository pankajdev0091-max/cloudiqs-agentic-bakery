AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudiQS Agentic AI Bakery - Serverless backend infrastructure.
  Deploys the FastAPI application behind API Gateway with DynamoDB for
  conversation persistence, S3 for the knowledge base, and Cognito for
  authentication.

# ===========================================================================
# Parameters
# ===========================================================================
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-20250514
    Description: Amazon Bedrock model ID for Strands agents

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: CloudWatch log retention in days

# ===========================================================================
# Global settings
# ===========================================================================
Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        AWS_REGION_NAME: !Ref AWS::Region
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        DYNAMODB_TABLE: !Ref ConversationsTable
        S3_KNOWLEDGE_BUCKET: !Ref KnowledgeBaseBucket
        COGNITO_USER_POOL_ID: !Ref CognitoUserPool

  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
      AllowOrigin: "'*'"

# ===========================================================================
# Resources
# ===========================================================================
Resources:

  # -----------------------------------------------------------------------
  # API Gateway (HTTP API)
  # -----------------------------------------------------------------------
  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Description: CloudiQS Agentic AI Bakery HTTP API
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
        MaxAge: 600
      Tags:
        Project: CloudiQS
        Environment: !Ref Environment

  # -----------------------------------------------------------------------
  # Lambda Function (FastAPI via Mangum)
  # -----------------------------------------------------------------------
  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "cloudiqs-backend-${Environment}"
      Description: CloudiQS Agentic AI Bakery FastAPI backend
      CodeUri: ../../
      Handler: backend.lambda_handler.handler
      Layers:
        - !Ref DependenciesLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - S3ReadPolicy:
            BucketName: !Ref KnowledgeBaseBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/*"
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:GetUser
              Resource: !GetAtt CognitoUserPool.Arn
      Events:
        RootPath:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY
      Tags:
        Project: CloudiQS
        Environment: !Ref Environment

  # Lambda layer for pip dependencies
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "cloudiqs-deps-${Environment}"
      Description: Python dependencies for the CloudiQS backend
      ContentUri: ../../backend/
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - arm64
    Metadata:
      BuildMethod: python3.12

  # CloudWatch log group with retention
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/cloudiqs-backend-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  # -----------------------------------------------------------------------
  # DynamoDB - Conversation History
  # -----------------------------------------------------------------------
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "cloudiqs-conversations-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-conversations-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: CloudiQS
        - Key: Environment
          Value: !Ref Environment

  # -----------------------------------------------------------------------
  # S3 - Knowledge Base Documents
  # -----------------------------------------------------------------------
  KnowledgeBaseBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "cloudiqs-knowledge-base-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
      Tags:
        - Key: Project
          Value: CloudiQS
        - Key: Environment
          Value: !Ref Environment

  # -----------------------------------------------------------------------
  # Cognito - User Authentication
  # -----------------------------------------------------------------------
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "cloudiqs-users-${Environment}"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      MfaConfiguration: "OFF"
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: CloudiQS
        Environment: !Ref Environment

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "cloudiqs-web-client-${Environment}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO

# ===========================================================================
# Outputs
# ===========================================================================
Outputs:
  ApiUrl:
    Description: URL for the CloudiQS API
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  ConversationsTableName:
    Description: DynamoDB table name for conversation storage
    Value: !Ref ConversationsTable
    Export:
      Name: !Sub "${AWS::StackName}-ConversationsTable"

  KnowledgeBucketName:
    Description: S3 bucket for the knowledge base
    Value: !Ref KnowledgeBaseBucket
    Export:
      Name: !Sub "${AWS::StackName}-KnowledgeBucket"

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  CognitoClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
